<style>
  /* ---------- 1. Design tokens: change these to restyle the whole page ---------- */
  :root {
    --bg: #0e0d0c;
    --surface: #171614;
    --ink: #f3efe7;
    --muted: #8f897e;
    --line: #2a2825;
    --gold: #d9b26a;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- 2. Hero: three rows of covers drifting sideways ---------- */
  .hero { position: relative; height: 88vh; min-height: 560px; overflow: hidden; display: grid; place-items: center; }
  .rails { position: absolute; inset: -10% -20%; display: flex; flex-direction: column; justify-content: center; gap: 22px;
           transform: rotate(-8deg) scale(1.05); opacity: .55; }
  .rail { display: flex; gap: 22px; width: max-content; animation: drift var(--speed, 90s) linear infinite; }
  .rail.reverse { animation-direction: reverse; }
  .rail img, .rail .fallback { width: 150px; height: 220px; border-radius: 6px; object-fit: cover; flex: none; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* dark fade over the moving covers so the title stays readable */
  .hero::after { content: ""; position: absolute; inset: 0;
                 background: radial-gradient(ellipse at center, rgba(14,13,12,.75) 0%, rgba(14,13,12,.92) 55%, var(--bg) 100%); }
  .hero-text { position: relative; z-index: 1; text-align: center; padding: 0 24px; }
  .eyebrow { color: var(--gold); letter-spacing: .3em; text-transform: uppercase; font-size: 11px; }
  .hero h1 { font: 300 clamp(56px, 10vw, 128px)/0.95 var(--serif); letter-spacing: -0.03em; margin: 18px 0 22px; }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero p { color: var(--muted); max-width: 460px; margin: 0 auto; }
  .hero-stats { display: flex; gap: 48px; justify-content: center; margin-top: 40px; }
  .hero-stats b { display: block; font: 300 30px/1 var(--serif); color: var(--ink); }
  .hero-stats span { color: var(--muted); font-size: 12px; }
  .scroll-cue { position: absolute; bottom: 28px; left: 50%; z-index: 1; transform: translateX(-50%); color: var(--muted); font-size: 12px; text-decoration: none; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, 6px); } }

  /* ---------- 3. Sticky toolbar ---------- */
  .toolbar { position: sticky; top: 0; z-index: 10; background: rgba(14,13,12,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .toolbar-inner { max-width: 1320px; margin: 0 auto; padding: 14px 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1; min-width: 220px; position: relative; }
  .search input { width: 100%; padding: 10px 14px 10px 38px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; outline: none; transition: border-color .2s; }
  .search input:focus { border-color: var(--gold); }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .chips { display: flex; gap: 4px; }
  .chip { padding: 8px 14px; border: 1px solid transparent; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; transition: all .2s; }
  .chip:hover { color: var(--ink); }
  .chip.active { border-color: var(--gold); color: var(--gold); }
  select { padding: 9px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  .price-filter { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .price-filter b { color: var(--ink); font-weight: 500; min-width: 30px; font-variant-numeric: tabular-nums; }
  .price-filter input { accent-color: var(--gold); width: 110px; cursor: pointer; }
  .count { color: var(--muted); font-size: 12px; min-width: 90px; text-align: right; }

  /* ---------- 4. Grid of covers ---------- */
  main { max-width: 1320px; margin: 0 auto; padding: 40px 32px 120px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 40px 28px; }
  .card { cursor: pointer; perspective: 800px; opacity: 0; transform: translateY(24px);
          transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .card.visible { opacity: 1; transform: none; }   /* added by JavaScript when the card scrolls into view */
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: var(--surface);
           box-shadow: 0 10px 30px rgba(0,0,0,.45); transform-style: preserve-3d;
           transition: transform .4s var(--ease), box-shadow .4s var(--ease); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* spine shadow on the left edge makes it read as a physical book */
  .cover::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
                   background: linear-gradient(90deg, rgba(0,0,0,.35) 0, rgba(255,255,255,.08) 3%, transparent 7%); }
  /* light glare that follows the mouse (position set by JavaScript through --mx / --my) */
  .cover::after { content: ""; position: absolute; inset: 0; z-index: 2; opacity: 0; transition: opacity .3s; pointer-events: none;
                  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.28), transparent 55%); }
  .card:hover .cover { box-shadow: 0 30px 60px rgba(0,0,0,.6); }
  .card:hover .cover::after { opacity: 1; }
  .meta { margin-top: 14px; }
  .meta h3 { font: 400 15px/1.3 var(--serif); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .meta-row .price { color: var(--ink); font-variant-numeric: tabular-nums; }
  .stars { color: var(--gold); letter-spacing: 1px; }
  .stars .off { color: var(--line); }

  /* Generated cover, used when a book has no image (or it fails to load) */
  .fallback { display: flex; flex-direction: column; justify-content: space-between; padding: 18px 16px; width: 100%; height: 100%;
              background: linear-gradient(160deg, hsl(var(--h), 35%, 30%), hsl(calc(var(--h) + 40), 40%, 14%)); }
  .fallback .ft { font: 400 17px/1.15 var(--serif); color: #f6f1e7; }
  .fallback .fl { width: 28px; height: 1px; background: rgba(246,241,231,.6); }
  .fallback .fs { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: rgba(246,241,231,.6); }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 80px 0; }
  .notice { max-width: 1320px; margin: 0 auto 0; padding: 0 32px; color: var(--muted); font-size: 12px; }
  .notice div { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; margin-top: 24px; }

  /* ---------- 5. Detail panel (opens when you click a book) ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5,5,4,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
             display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; max-width: 760px; width: 100%;
           display: grid; grid-template-columns: 260px 1fr; gap: 36px; padding: 36px; position: relative;
           transform: translateY(20px) scale(.98); transition: transform .4s var(--ease); }
  .overlay.open .panel { transform: none; }
  .panel .cover { box-shadow: 0 30px 60px rgba(0,0,0,.6); }
  .panel h2 { font: 300 32px/1.1 var(--serif); letter-spacing: -0.01em; margin: 10px 0 18px; }
  .panel .stars { font-size: 16px; }
  .panel dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 24px; margin: 26px 0 30px; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .panel dt { color: var(--muted); }
  .panel .big-price { font: 300 40px/1 var(--serif); }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--gold); color: #1a1610; text-decoration: none; font-weight: 500; transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
  .close { position: absolute; top: 14px; right: 16px; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .close:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .toolbar-inner, main { padding-left: 18px; padding-right: 18px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 28px 16px; }
    .panel { grid-template-columns: 1fr; padding: 24px; }
    .panel > .cover { max-width: 180px; }
    .price-filter { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .price-filter b { color: var(--ink); font-weight: 500; min-width: 30px; font-variant-numeric: tabular-nums; }
  .price-filter input { accent-color: var(--gold); width: 110px; cursor: pointer; }
  .count { display: none; }
  }
  /* Respect people who have "reduce motion" turned on in their system settings */
  @media (prefers-reduced-motion: reduce) {
    .rail, .scroll-cue { animation: none; }
    .card { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>

const BASE = "https://books.toscrape.com/";
const BOOKS = RAW.map((r, i) => ({
  id: i + 1, title: r[0], price_gbp: r[1], rating: r[2], availability: r[3],
  url: BASE + "catalogue/" + r[4] + "/index.html",
  image_url: COVERS[r[4]] ? BASE + "media/cache/" + COVERS[r[4]] : null,
}));

/* =====================================================================
   2. STATE — everything the page remembers. Change state, then render().
   ===================================================================== */
const state = { books: [], search: "", minRating: 0, maxPrice: 60, sort: "id-asc" };

/* =====================================================================
   3. LOAD the books: from Supabase if configured (in chunks of 1,000, like read_books()),
   otherwise from the BOOKS list above
   ===================================================================== */
async function loadBooks() {
  // No Supabase details? Use the 1,000 books built into this file.
  if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
    if (!Object.keys(COVERS).length) showNotice("The real covers haven't been added yet. In Terminal, run  python3 add_covers.py  in this folder, then reload the page.");
    return BOOKS;
  }
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const all = [];
  for (let start = 0; ; start += 1000) {
    const { data, error } = await client.from(TABLE_NAME)
      .select("id, title, price_gbp, rating, availability, url, image_url")
      .order("id").range(start, start + 999);
    if (error) throw error;
    all.push(...data);
    if (data.length < 1000) break;
  }
  if (!all.length) showNotice("Connected, but no rows came back. Check that the table has data and that the read policy exists.");
  else if (!all.some(b => b.image_url)) showNotice("No cover images found. Run add_image_column.sql in Supabase, then run  python3 supabase_books.py write  again to fill in the covers.");
  return all;
}

/* =====================================================================
   4. HELPERS — small functions that turn data into HTML
   ===================================================================== */
const $ = id => document.getElementById(id);
const gbp = n => "£" + Number(n).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stars = n => "★".repeat(n) + `<span class="off">${"★".repeat(5 - n)}</span>`;

// A generated cover: the colour comes from the title, so each book always gets the same one
function fallbackCover(b) {
  const hue = [...b.title].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  return `<div class="fallback" style="--h:${hue}"><div class="ft">${esc(b.title)}</div><div><div class="fl"></div><br><div class="fs">The Library</div></div></div>`;
}
// The real cover if we have one; if the image fails to load, swap in the generated cover
function coverHtml(b, eager = false) {
  if (!b.image_url) return fallbackCover(b);
  return `<img src="${esc(b.image_url)}" alt="${esc(b.title)}" ${eager ? "" : 'loading="lazy"'} onerror="this.outerHTML = fallbackCover(state.books.find(x => x.id === ${b.id}))">`;
}

/* =====================================================================
   5. FILTER + SORT
   ===================================================================== */
function visibleBooks() {
  const q = state.search.trim().toLowerCase();
  const [field, dir] = state.sort.split("-");
  return state.books
    .filter(b => b.title.toLowerCase().includes(q) && (b.rating ?? 0) >= state.minRating && b.price_gbp <= state.maxPrice)
    .sort((a, b) => {
      const r = typeof a[field] === "string" ? a[field].localeCompare(b[field]) : a[field] - b[field];
      return dir === "desc" ? -r : r;
    });
}

/* =====================================================================
   6. RENDER the grid (all matching books, images load lazily as you scroll)
   ===================================================================== */
function render() {
  const list = visibleBooks();
  $("count").textContent = `${list.length.toLocaleString()} ${list.length === 1 ? "book" : "books"}`;
  $("grid").innerHTML = list.length ? list.map(b => `
    <article class="card" data-id="${b.id}">
      <div class="cover">${coverHtml(b)}</div>
      <div class="meta">
        <h3>${esc(b.title)}</h3>
        <div class="meta-row"><span class="stars">${stars(b.rating ?? 0)}</span><span class="price">${gbp(b.price_gbp)}</span></div>
      </div>
    </article>`).join("") : `<p class="empty">No books match your search.</p>`;
  watchCards();
}

/* Hero: fill three moving rails with covers. Each rail's content is repeated twice,
   and the animation moves it exactly half its width, so the loop is seamless. */
function renderHero() {
  const books = state.books;
  const n = books.length;
  $("stat-count").textContent = n.toLocaleString();
  $("stat-price").textContent = n ? gbp(books.reduce((s, b) => s + Number(b.price_gbp), 0) / n) : "–";
  $("stat-five").textContent = books.filter(b => b.rating === 5).length.toLocaleString();

  const shuffled = [...books].sort(() => Math.random() - 0.5);
  const speeds = ["110s", "140s", "95s"];
  $("rails").innerHTML = [0, 1, 2].map(r => {
    let row = shuffled.filter((_, i) => i % 3 === r).slice(0, 16);
    while (row.length && row.length < 12) row = row.concat(row);       // enough covers to fill wide screens
    const items = row.map(b => coverHtml(b, true)).join("");
    return `<div class="rail ${r === 1 ? "reverse" : ""}" style="--speed:${speeds[r]}">${items}${items}</div>`;
  }).join("");
}

/* =====================================================================
   7. MOTION
   ===================================================================== */
// a) Fade cards in as they scroll into view
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
  });
}, { rootMargin: "0px 0px -40px 0px" });

function watchCards() {
  document.querySelectorAll(".card").forEach((card, i) => {
    card.style.transitionDelay = `${(i % 6) * 60}ms`;   // small stagger, one "row" at a time
    io.observe(card);
  });
}

// b) 3D tilt + glare that follows the mouse over a cover
$("grid").addEventListener("mousemove", e => {
  const cover = e.target.closest(".cover");
  if (!cover) return;
  const r = cover.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;      // 0 (left) → 1 (right)
  const y = (e.clientY - r.top) / r.height;      // 0 (top)  → 1 (bottom)
  cover.style.transform = `rotateY(${(x - 0.5) * 16}deg) rotateX(${(0.5 - y) * 16}deg) translateY(-8px)`;
  cover.style.setProperty("--mx", `${x * 100}%`);
  cover.style.setProperty("--my", `${y * 100}%`);
});
$("grid").addEventListener("mouseout", e => {
  const cover = e.target.closest(".cover");
  if (cover && !cover.contains(e.relatedTarget)) cover.style.transform = "";
});

/* =====================================================================
   8. DETAIL PANEL
   ===================================================================== */
function openBook(id) {
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  $("panel").innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <div class="cover">${coverHtml(b, true)}</div>
    <div>
      <div class="eyebrow">No. ${b.id}</div>
      <h2>${esc(b.title)}</h2>
      <div class="stars">${stars(b.rating ?? 0)}</div>
      <dl>
        <dt>Rating</dt><dd>${b.rating} out of 5</dd>
        <dt>Availability</dt><dd>${esc(b.availability)}</dd>
      </dl>
      <div class="big-price">${gbp(b.price_gbp)}</div><br>
      <a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">View on the store →</a>
    </div>`;
  $("overlay").classList.add("open");
}
const closeBook = () => $("overlay").classList.remove("open");

$("grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) openBook(Number(card.dataset.id));
});
$("overlay").addEventListener("click", e => {
  if (e.target === $("overlay") || e.target.closest(".close")) closeBook();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeBook(); });

/* =====================================================================
   9. CONTROLS — update state, then render
   ===================================================================== */
$("search").addEventListener("input", e => { state.search = e.target.value; render(); });
$("price").addEventListener("input", e => {
  state.maxPrice = Number(e.target.value);
  $("price-label").textContent = "£" + e.target.value;
  render();
});
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.querySelectorAll("#rating-chips .chip").forEach(chip => chip.addEventListener("click", () => {
  document.querySelectorAll("#rating-chips .chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  state.minRating = Number(chip.dataset.rating);
  render();
}));

function showNotice(text) { $("notice").firstElementChild.textContent = text; $("notice").hidden = false; }

/* Start */
loadBooks()
  .then(books => { state.books = books; renderHero(); render(); })
  .catch(err => { $("grid").innerHTML = `<p class="empty">Couldn't load books: ${esc(err.message)}</p>`; });
</script>
