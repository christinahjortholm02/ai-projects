<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episodely · Episode Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- 1. Design tokens: all colours & sizes in ONE place ---------- */
    :root {
      --bg:       #0e1116;   /* near-black background */
      --surface:  #161b22;   /* cards */
      --surface-2:#1f2630;   /* hover / inputs */
      --border:   #2a313c;
      --text:     #e6e9ee;
      --muted:    #8b95a5;
      --accent:   #3b82f6;   /* single blue accent */
      --accent-hover: #2563eb;
      --radius:   10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 2. Top navigation bar ---------- */
    header {
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
      background: rgba(14, 17, 22, 0.85);
      backdrop-filter: blur(8px);          /* frosted-glass effect when scrolling */
    }
    nav { display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 6px; background: var(--accent);
      display: grid; place-items: center;
    }
    nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
    nav a:hover { color: var(--text); }

    /* ---------- 3. Hero + search ---------- */
    .hero { padding: 72px 0 40px; max-width: 720px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .hero h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.03em; margin: 12px 0 14px; }
    .hero p { color: var(--muted); font-size: 17px; line-height: 1.6; margin: 0 0 32px; }

    #search-form {
      display: flex; gap: 10px;
    }
    .search-box {
      flex: 1; display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
    .search-box svg { flex-shrink: 0; color: var(--muted); }
    #show-input {
      flex: 1; height: 50px; border: none; outline: none; background: transparent;
      font: inherit; font-size: 16px; color: var(--text);
    }
    #show-input::placeholder { color: var(--muted); }
    #search-form button {
      border: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 15px;
      color: white; background: var(--accent); padding: 0 26px; border-radius: var(--radius);
      transition: background .15s;
    }
    #search-form button:hover { background: var(--accent-hover); }

    .suggestions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .suggestions span { color: var(--muted); font-size: 13px; margin-right: 4px; }
    .chip {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { color: var(--text); border-color: var(--muted); }

    /* ---------- 4. Status: spinner & messages ---------- */
    #status { color: var(--muted); font-size: 15px; margin: 10px 0 24px; display: flex; align-items: center; gap: 12px; }
    .spinner {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 5. Show overview ---------- */
    .show-card {
      display: grid; grid-template-columns: 200px 1fr; gap: 32px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px; margin-bottom: 40px;
      animation: fadeIn .3s ease;
    }
    .show-card img { width: 100%; border-radius: 8px; display: block; }
    .show-card h2 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 14px; }
    .meta { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 18px; }
    .meta div { font-size: 13px; color: var(--muted); }
    .meta strong { display: block; color: var(--text); font-size: 15px; font-weight: 600; margin-top: 2px; }
    .genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .genre { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
    .summary { color: #b5bdc9; line-height: 1.65; margin: 0; max-width: 680px; }

    /* ---------- 6. Season tabs (underline style) ---------- */
    .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .section-head h3 { font-size: 20px; margin: 0; }
    .section-head span { color: var(--muted); font-size: 14px; }
    .tabs {
      display: flex; gap: 4px; overflow-x: auto;
      border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .tab {
      border: none; background: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500;
      color: var(--muted); padding: 14px 14px; white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    /* ---------- 7. Episode grid ---------- */
    .episodes {
      display: grid; gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));   /* responsive columns */
      margin-bottom: 72px;
    }
    .episode {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; transition: border-color .15s, transform .15s;
      animation: fadeIn .3s ease both;
    }
    .episode:hover { border-color: #3a4352; transform: translateY(-2px); }
    .thumb { aspect-ratio: 16 / 9; background: var(--surface-2); position: relative; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; bottom: 8px; left: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
      background: rgba(0,0,0,.75); color: white; padding: 3px 8px; border-radius: 4px;
    }
    .episode-body { padding: 14px 16px 16px; }
    .episode h4 { font-size: 15px; font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
    .episode .info { font-size: 13px; color: var(--muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 24px 0 32px; }
    footer a { color: var(--text); }

    @media (max-width: 640px) {
      .show-card { grid-template-columns: 1fr; }
      .show-card img { max-width: 180px; }
      #search-form { flex-direction: column; }
      #search-form button { height: 48px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <div class="logo-mark">
            <!-- simple "play" icon drawn with SVG -->
            <svg width="12" height="12" viewBox="0 0 12 12" fill="white"><path d="M3 1.5v9l7.5-4.5z"/></svg>
          </div>
          Episodely
        </div>
        <a href="https://www.tvmaze.com/api" target="_blank">API by TVmaze</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="eyebrow">Episode Guide</div>
      <h1>Find every episode of any TV show.</h1>
      <p>Search a title to see its full episode list, organised by season, with air dates and runtimes.</p>

      <!-- A <form> makes the Enter key submit automatically -->
      <form id="search-form">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="show-input" type="text" placeholder="Search for a show, e.g. The Big Bang Theory" autocomplete="off" autofocus>
        </div>
        <button type="submit">Search</button>
      </form>

      <div class="suggestions">
        <span>Popular:</span>
        <button class="chip">The Big Bang Theory</button>
        <button class="chip">Breaking Bad</button>
        <button class="chip">The Office</button>
        <button class="chip">Succession</button>
      </div>
    </section>

    <div id="status"></div>
    <div id="results"></div>
  </main>

  <footer>
    <div class="container">Data provided by <a href="https://www.tvmaze.com" target="_blank">TVmaze.com</a></div>
  </footer>

  <script>
    // ===== 1. Grab the HTML elements we'll use =====
    const form    = document.getElementById("search-form");
    const input   = document.getElementById("show-input");
    const status  = document.getElementById("status");
    const results = document.getElementById("results");

    // ===== 2. Search when the form is submitted (button click OR Enter) =====
    form.addEventListener("submit", (event) => {
      event.preventDefault();               // stop the page reloading
      const showName = input.value.trim();
      if (showName) searchShow(showName);
    });

    // Suggestion chips: fill the box and search
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        input.value = chip.textContent;
        searchShow(chip.textContent);
      });
    });

    // ===== 3. Call the TVmaze API =====
    async function searchShow(showName) {
      status.innerHTML = `<div class="spinner"></div>Loading episodes…`;
      results.innerHTML = "";

      // singlesearch = best single match; embed=episodes = include all episodes in the same answer
      const url = "https://api.tvmaze.com/singlesearch/shows?q="
                  + encodeURIComponent(showName) + "&embed=episodes";

      try {
        const response = await fetch(url);

        if (response.status === 404) {
          status.textContent = `No results for “${showName}”. Check the spelling and try again.`;
          return;
        }
        if (!response.ok) throw new Error("API error " + response.status);

        const show = await response.json();         // JSON text → JavaScript object
        const episodes = show._embedded.episodes;

        status.innerHTML = "";
        displayShow(show, episodes);
      } catch (error) {
        status.textContent = "Something went wrong: " + error.message;
      }
    }

    // ===== 4. Build the show overview + season tabs =====
    function displayShow(show, episodes) {
      // Group episodes by season → { 1: [...], 2: [...], ... }
      const seasons = {};
      for (const ep of episodes) {
        if (!seasons[ep.season]) seasons[ep.season] = [];
        seasons[ep.season].push(ep);
      }
      const seasonNumbers = Object.keys(seasons);

      const poster  = show.image ? `<img src="${show.image.medium}" alt="${show.name} poster">` : "";
      const years   = show.premiered
        ? show.premiered.slice(0, 4) + (show.ended ? "–" + show.ended.slice(0, 4) : "–present")
        : "—";
      const rating  = show.rating && show.rating.average ? show.rating.average + " / 10" : "—";
      const network = (show.network && show.network.name) || (show.webChannel && show.webChannel.name) || "—";
      const genres  = show.genres.map((g) => `<span class="genre">${g}</span>`).join("");

      results.innerHTML = `
        <div class="show-card">
          ${poster}
          <div>
            <h2>${show.name}</h2>
            <div class="meta">
              <div>Years<strong>${years}</strong></div>
              <div>Network<strong>${network}</strong></div>
              <div>Rating<strong>${rating}</strong></div>
              <div>Seasons<strong>${seasonNumbers.length}</strong></div>
              <div>Episodes<strong>${episodes.length}</strong></div>
            </div>
            <div class="genres">${genres}</div>
            <p class="summary">${stripHtml(show.summary)}</p>
          </div>
        </div>

        <div class="section-head">
          <h3>Episodes</h3>
          <span id="season-count"></span>
        </div>
        <div class="tabs">
          ${seasonNumbers.map((n) => `<button class="tab" data-season="${n}">Season ${n}</button>`).join("")}
        </div>
        <div class="episodes" id="episodes"></div>
      `;

      // Clicking a tab shows that season's episodes
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => showSeason(tab.dataset.season, seasons));
      });

      showSeason(seasonNumbers[0], seasons);   // start on the first season
    }

    // ===== 5. Show the episode cards for one season =====
    function showSeason(seasonNumber, seasons) {
      // Highlight the active tab
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.season === seasonNumber);
      });

      const list = seasons[seasonNumber];
      document.getElementById("season-count").textContent = `${list.length} episodes in season ${seasonNumber}`;

      document.getElementById("episodes").innerHTML = list.map((ep, i) => {
        const code  = `S${pad(ep.season)} · E${ep.number ? pad(ep.number) : "SP"}`;   // e.g. S01 · E05
        const thumb = ep.image ? `<img src="${ep.image.medium}" alt="" loading="lazy">` : "No image";
        return `
          <article class="episode" style="animation-delay:${i * 25}ms">
            <div class="thumb">${thumb}<span class="badge">${code}</span></div>
            <div class="episode-body">
              <h4>${ep.name}</h4>
              <div class="info">${formatDate(ep.airdate)}${ep.runtime ? ` · ${ep.runtime} min` : ""}</div>
            </div>
          </article>`;
      }).join("");
    }

    // ===== 6. Small helper functions =====
    function pad(n) { return String(n).padStart(2, "0"); }           // 5 → "05"

    function stripHtml(text) {                                        // "<p>Hi</p>" → "Hi"
      return text ? text.replace(/<[^>]*>/g, "") : "No summary available.";
    }

    function formatDate(dateString) {                                  // "2007-09-24" → "24 Sept 2007"
      if (!dateString) return "TBA";
      return new Date(dateString).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }
  </script>
</body>
</html>
